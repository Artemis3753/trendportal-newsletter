<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 트란시스 카드뉴스 비서 — 플러그인 창(계산대). code.js가 읽어 온 결과를 zip으로 묶어 내려받게 한다.
     시안 1107-3(대화 말풍선) 위에 읽기·내려받기 버튼만 시안 1107-2(크림 위 눌리는 토마토 버튼)로 입혔다. -->
<style>
  /* hidden이 아래 display 규칙에 덮이지 않게 (안 넣으면 내려받기 버튼이 처음부터 보임, 10/17) */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: #f3efff; color: #2e2550;
    font: 13px/1.5 "Apple SD Gothic Neo", system-ui, sans-serif;
    word-break: keep-all;
  }

  /* 마스코트: 이 플러그인은 인터넷이 막혀 있어서 그림을 파일 안에 직접 넣었다(맨 아래 변수 두 줄) */
  .m { display: block; background-repeat: no-repeat; background-position: center; }
  .m.face { background-image: var(--img-face); background-size: cover; border-radius: 50%; }
  .m.thumbs { background-image: var(--img-thumbs); background-size: contain; }

  .hd { flex: none; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5dcff; }
  .av { position: relative; width: 34px; height: 34px; flex: none; }
  .av .m.face { width: 34px; height: 34px; box-shadow: 0 0 0 2px #e5dcff; }
  .acc { position: absolute; right: -6px; bottom: -5px; font-size: 13px; }
  h1 { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.2; }

  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.me { justify-content: flex-end; }
  .mini { flex: none; width: 30px; height: 30px; }
  .bub { max-width: 82%; padding: 9px 13px; border-radius: 4px 18px 18px 18px; background: #fff; border: 1px solid #e5dcff; box-shadow: 0 2px 8px rgba(122, 90, 248, .08); font-size: 13px; overflow-wrap: anywhere; }
  .msg.me .bub { border-radius: 18px 4px 18px 18px; background: #7a5af8; border-color: #7a5af8; color: #fff; }
  .bub.wide { max-width: calc(100% - 38px); width: 100%; }
  #sel.bad { color: #c4283a; font-weight: 700; }

  .dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #7a5af8; animation: dot 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

  .prog { height: 10px; margin-top: 8px; border-radius: 99px; overflow: hidden; background: #ebe5ff; }
  .prog i { display: block; height: 100%; width: 40%; border-radius: 99px; background: repeating-linear-gradient(135deg, #7a5af8 0 8px, #a48dfa 8px 16px); background-size: 28px 100%; transition: width .25s; animation: slide 1.4s linear infinite; }
  @keyframes slide { to { background-position: 28px 0; } }

  #out.err { color: #c4283a; font-weight: 700; }
  .info { display: block; margin: 6px 0 10px; font-size: 11.5px; color: #5d5580; }
  .sleep { align-self: center; margin-top: auto; padding-top: 4px; }
  .sleep .m { width: 110px; height: 82px; }

  /* 하단: 크림 바탕 + 눌리는 토마토 버튼(시안 1107-2). 눌리는 느낌 = 아래 그림자가 얇아지며 내려앉음 */
  .bar { flex: none; padding: 10px 14px 14px; background: #fdf8ee; border-top: 1px solid #efe3cf; }
  .chk { display: flex; align-items: center; gap: 6px; margin: 0 2px 10px; font-size: 11.5px; color: #6d5f56; }
  .scan { display: block; width: 100%; height: 42px; margin: 0 0 4px; border: 0; border-radius: 99px; background: #e4572e; color: #fff; font: 800 14px/1 "Apple SD Gothic Neo", sans-serif; box-shadow: 0 4px 0 #b8401d; cursor: pointer; }
  .scan:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b8401d; }
  .scan:disabled { opacity: .5; box-shadow: 0 2px 0 #b8401d; transform: translateY(2px); cursor: default; }
  .dl { display: block; margin: 0 0 6px; height: 40px; border-radius: 99px; background: #2f9e6b; color: #fff; box-shadow: 0 4px 0 #1f7a4f; text-align: center; font-weight: 800; font-size: 13.5px; line-height: 40px; text-decoration: none; cursor: pointer; }
  .dl:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f7a4f; }

  /* 창이 커져서 남는 대화 영역을 마스코트로 채운다. 읽기를 누르기 전(처음 화면)에서만 보인다(#chat의 idle 클래스를 읽기 버튼이 끈다).
     ::after는 늘 맨 아래에 오고, margin-top:auto가 남는 공간을 위로 밀어 준다. */
  .chat.idle::after { content: ""; flex: none; width: 104px; height: 104px; margin: auto auto 6px; border-radius: 50%;
    background: var(--img-face) center / cover no-repeat; box-shadow: 0 0 0 4px #e5dcff, 0 6px 18px rgba(122, 90, 248, .18); }
  /* 창이 낮으면(최소 높이 400 근처) 마스코트까지 넣을 때 대화 영역이 넘쳐서 스크롤이 생기고 첫 안내 말풍선이 위에서 잘린다.
     높이 480 이상이면 최소 폭 320에서도 안내 말풍선 둘과 마스코트가 다 들어가는 것을 캡처로 확인했다(480 미만에선 뺀다). */
  @media (max-height: 479px) { .chat.idle::after { display: none; } }

  /* 창 크기 손잡이: 오른쪽 아래 모서리에 겹쳐 둔다. 눈에 보이는 건 10px 줄무늬지만 잡기 편하게 누르는 칸은 16px.
     하단 크림 바의 버튼(오른쪽 여백 14px, 아래 여백 18px)의 둥근 모서리 바깥에 들어가서 버튼과는 겹치지 않는다. */
  .grip { position: fixed; right: 0; bottom: 0; z-index: 20; display: block; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none; color: #d6c3a3; }
  .grip svg { position: absolute; right: 3px; bottom: 3px; display: block; }
  .grip:hover, .grip.on { color: #e4572e; }

  @media (prefers-reduced-motion: reduce) { .dots i, .prog i { animation: none !important; } }

<body>
  <header class="hd">
    <span class="av"><i class="m face"></i><b class="acc">📇</b></span>
    <h1>트란시스 카드뉴스 비서</h1>
  </header>

  <main class="chat idle" id="chat">
    <div class="msg bot"><i class="m face mini"></i><div class="bub">카드 묶음을 선택하고 읽기를 누르면, 카드 글자·글자 뺀 카드 그림·표지를 zip 하나로 내려받아요.</div></div>
    <div class="msg bot"><i class="m face mini"></i><div class="bub bad" id="sel">선택한 게 없어요</div></div>

    <!-- 읽기를 누르면 나타나는 대화: 나의 말풍선 + 트란시스의 진행·완료 말풍선 -->
    <div class="msg me" id="runMe" hidden><div class="bub">읽어 줘!</div></div>
    <div class="msg bot" id="runBot" hidden>
      <i class="m face mini"></i>
      <div class="bub wide">
        <span class="dots" id="dots"><i></i><i></i><i></i></span><span id="out"></span>
        <div class="prog" id="prog" hidden><i id="progbar"></i></div>
        <span class="info" id="info" hidden></span>
        <a class="dl" id="dl" hidden>zip 내려받기</a>
      </div>
    </div>
    <div class="sleep" id="sleep" hidden><i class="m thumbs"></i></div>
  </main>

  <div class="bar">
    <label class="chk"><input type="checkbox" id="dark" checked> 어두운 그라데이션(사진 아래 검은 띠) 지우기</label>
    <button class="scan" id="scan" disabled>선택한 묶음 읽기</button>
  </div>
  <i class="grip" id="grip" title="끌어서 창 크기 조절" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M9 1 1 9M9 5 5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></i>

<script>
const $ = id => document.getElementById(id);

// ── zip 만들기: 압축 없이 담기만 하는 가장 단순한 zip (라이브러리 없이 — 플러그인은 인터넷을 안 쓰게 막아 둠) ──
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// files: [{ name: 'figma/scan.json', bytes: Uint8Array }]
function makeZip(files) {
  const enc = new TextEncoder();
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
    const head = new DataView(new ArrayBuffer(30));
    // 0x0800 = 파일 이름이 UTF-8 (한글 이름이 맥·윈도에서 안 깨지게)
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2],
     [14, crc, 4], [18, size, 4], [22, size, 4], [26, name.length, 2], [28, 0, 2]]
      .forEach(([at, v, len]) => len === 4 ? head.setUint32(at, v, true) : head.setUint16(at, v, true));
    const cd = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2],
     [16, crc, 4], [20, size, 4], [24, size, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2],
     [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([at, v, len]) => len === 4 ? cd.setUint32(at, v, true) : cd.setUint16(at, v, true));
    parts.push(new Uint8Array(head.buffer), name, f.bytes);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((s, b) => s + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2],
   [12, cdSize, 4], [16, offset, 4], [20, 0, 2]]
    .forEach(([at, v, len]) => len === 4 ? end.setUint32(at, v, true) : end.setUint16(at, v, true));
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

// ── 다시 압축: 피그마의 JPG 내보내기는 화질을 고를 수 없고 거의 최고 화질이라 카드 한 장이 3MB쯤 된다(10/17 744 = zip 27MB).
// 이 창(웹 화면)의 canvas로 다시 저장하면 화질을 고를 수 있다. 85% = 사이트에 올릴 때(sips·ffmpeg) 쓰는 품질과 같다.
// 다시 저장한 게 오히려 크면 원래 것을 그대로 둔다
const RECOMPRESS = [['figma/composites/', 0.85], ['figma/cover-export.jpg', 0.85], ['figma/cards/', 0.8]];
async function recompress(f) {
  const rule = RECOMPRESS.find(([prefix]) => f.name.startsWith(prefix));
  if (!rule) return f;
  try {
    const img = await createImageBitmap(new Blob([f.bytes], { type: 'image/jpeg' }));
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', rule[1]));
    const bytes = new Uint8Array(await blob.arrayBuffer());
    return bytes.length < f.bytes.length ? { name: f.name, bytes: bytes } : f;
  } catch (e) {
    return f; // 못 줄이면 원래 것으로 — zip이 조금 클 뿐 결과는 같다
  }
}

let running = false;
const SCAN_LABEL = '선택한 묶음 읽기';

function toBottom() { $('chat').scrollTop = $('chat').scrollHeight; }

// 진행 말풍선 갱신. busy면 점 세 개와 진행 막대를 보인다. "5/12" 같은 숫자가 글에 있으면 막대를 그만큼 채운다
function setOut(text, busy) {
  $('out').className = '';
  $('out').textContent = text;
  $('dots').hidden = !busy;
  $('prog').hidden = !busy;
  if (busy) {
    const m = /(\d+)\s*\/\s*(\d+)/.exec(text);
    $('progbar').style.width = m && Number(m[2]) > 0 ? Math.round(Number(m[1]) / Number(m[2]) * 100) + '%' : '40%';
  }
  toBottom();
}

function endRun() {
  running = false;
  $('scan').disabled = false;
  $('scan').textContent = SCAN_LABEL;
}

$('scan').onclick = () => {
  running = true;
  $('scan').disabled = true;
  $('scan').textContent = '읽는 중…';
  $('runMe').hidden = false;
  $('runBot').hidden = false;
  $('sleep').hidden = true;
  $('dl').hidden = true;
  $('info').hidden = true;
  setOut(' 읽는 중…', true);
  parent.postMessage({ pluginMessage: { type: 'scan', dropDark: $('dark').checked } }, '*');
};

onmessage = async e => {
  const msg = e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'selection') {
    const sel = $('sel');
    sel.classList.toggle('bad', !!msg.error);
    if (msg.error) {
      sel.textContent = msg.error;
    } else {
      sel.textContent = '';
      const b = document.createElement('b');
      b.textContent = msg.name;
      const n = document.createElement('b');
      n.textContent = msg.count;
      sel.append(b, '에서 카드 ', n, '장 찾았어요! 읽어 볼까요?');
    }
    // 읽는 도중에 선택이 바뀌어도 버튼이 다시 켜져서 두 번 읽히지 않게 한다
    if (!running) $('scan').disabled = !!msg.error;
    toBottom();
  } else if (msg.type === 'error') {
    setOut('', false);
    $('out').className = 'err';
    $('out').textContent = msg.error;
    endRun();
  } else if (msg.type === 'progress') {
    setOut(' ' + msg.text, true);
  } else if (msg.type === 'scan') {
    const s = msg.scan;
    const json = new TextEncoder().encode(JSON.stringify(s, null, 1));
    const files = [];
    for (let i = 0; i < msg.files.length; i++) {
      setOut(` 용량 줄이는 중… ${i + 1}/${msg.files.length}`, true);
      files.push(await recompress(msg.files[i]));
    }
    const blob = makeZip([{ name: 'figma/scan.json', bytes: json }].concat(files));
    // 링크를 사람이 직접 누르게 한다 (플러그인 창에서 저절로 내려받기는 막힐 수 있어서)
    const old = $('dl').href;
    if (old) URL.revokeObjectURL(old);
    $('dl').href = URL.createObjectURL(blob);
    $('dl').download = `${s.group.name}.zip`;
    $('dl').textContent = `${s.group.name}.zip 내려받기`;
    $('dl').hidden = false;
    const texts = s.frames.reduce((n, f) => n + f.texts.length, 0);
    const imgs = s.frames.reduce((n, f) => n + f.images.length, 0);
    const mb = (blob.size / 1048576).toFixed(1);
    const cuts = files.filter(f => f.name.startsWith('figma/composites/')).length;
    const dark = s.frames.reduce((n, f) => n + (f.overlaysHidden ? f.overlaysHidden.length : 0), 0);
    setOut('다 담았어요! 🎉', false);
    $('info').textContent = `카드 ${s.frames.length}장 · 글자 ${texts}개 · 사진 레이어 ${imgs}개 · 글자 뺀 카드 ${cuts}장 + 표지 + 미리보기 · 어두운 막 ${dark}개 지움 · ${mb}MB`;
    $('info').hidden = false;
    $('sleep').hidden = false;
    endRun();
    toBottom();
  }
};
</script>

<script>
  // ── 읽기를 누르면 처음 화면의 마스코트를 치운다 ──
  // 읽기 버튼의 기존 처리(위 onclick)를 건드리지 않으려고 별도 리스너로 붙였다.
  document.getElementById('scan').addEventListener('click', () => document.getElementById('chat').classList.remove('idle'));

  // ── 창 크기 손잡이 ──
  // code.js의 SIZE와 같은 최소·최대 값. 두 파일이 서로 값을 불러올 수 없어서 숫자를 양쪽에 두니, 바꿀 땐 같이 바꿀 것.
  // (최소: 이보다 작으면 하단 버튼·체크 줄이 찌그러짐 / 최대: 이보다 크면 피그마 창을 넘어 손잡이를 다시 못 잡음)
  const MIN_W = 320, MIN_H = 400, MAX_W = 700, MAX_H = 900;

  (() => {
    const grip = document.getElementById('grip');
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    let drag = null;   // 끌기 시작 때의 포인터 화면 좌표와 창 크기
    let latest = null; // 아직 code.js에 못 보낸 가장 최근 크기
    let frame = 0;     // 예약된 requestAnimationFrame

    const send = (size, done) => parent.postMessage(
      { pluginMessage: { type: 'resize', width: size.w, height: size.h, done } }, '*');

    grip.addEventListener('pointerdown', (e) => {
      // 화면 기준 좌표(screenX/Y)로 "얼마나 끌었나"만 잰다. iframe 안 좌표(clientX/Y)는 창이 커지면 같이 움직여서
      // 계산이 꼬이기 때문이다. setPointerCapture는 커서가 창 밖으로 나가도 끌기가 안 끊기게 한다.
      drag = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight };
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('on');
      e.preventDefault();
    });

    grip.addEventListener('pointermove', (e) => {
      if (!drag) return;
      latest = {
        w: Math.round(clamp(drag.w + (e.screenX - drag.x), MIN_W, MAX_W)),
        h: Math.round(clamp(drag.h + (e.screenY - drag.y), MIN_H, MAX_H)),
      };
      // 포인터 이벤트는 프레임보다 훨씬 자주 오므로, 화면 한 프레임에 한 번만 보낸다.
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; if (latest) send(latest, false); });
    });

    // 손을 뗄 때(또는 끌기가 끊길 때) 마지막 크기를 보내면서 done=true로 "저장해도 됨"을 알린다.
    const end = () => {
      if (!drag) return;
      drag = null;
      grip.classList.remove('on');
      if (frame) { cancelAnimationFrame(frame); frame = 0; }
      if (latest) { send(latest, true); latest = null; }
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
    grip.addEventListener('lostpointercapture', end);
  })();
</script>
